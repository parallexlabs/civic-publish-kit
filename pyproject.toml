[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "civic-publish-kit"
version = "0.1.0"
description = "Safe, reproducible release workflow for explicitly mapped public civic GeoJSON/CSV and read-only public ArcGIS layers."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "ParalleX Labs Inc." }]
keywords = ["open data", "geojson", "arcgis", "civic", "release", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = [
    "requests==2.32.5",
    "shapely==2.1.2",
    "pyproj==3.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "responses==0.25.8",
    "ruff==0.13.0",
    "mypy==1.18.2",
    "types-requests==2.32.4.20250913",
    "build==1.3.0",
]

[project.scripts]
civic-publish = "civic_publish_kit.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["civic_publish_kit*"]

[tool.setuptools.package-data]
civic_publish_kit = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=civic_publish_kit",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.run]
source = ["civic_publish_kit"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "S",
    "PTH",
    "RET",
    "RUF",
    "ANN",
    "BLE",
    "PL",
    "PT",
    "T20",
]
ignore = [
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
    "S105",
    "S106",
    "ANN",
    "PLR2004",
    "PLC0415",
    "SIM108",
    "SIM300",
    "RUF001",
    "RUF043",
    "PT012",
]
"src/civic_publish_kit/cli.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["civic_publish_kit"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["shapely", "shapely.*"]
ignore_missing_imports = true
